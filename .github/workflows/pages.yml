# Автосборка и публикация «Кинотеки» (итоговая работа) на GitHub Pages.
# Запускается при каждом изменении ветки main, затрагивающем Итоговая,
# и вручную из вкладки Actions.
name: Публикация Кинотеки

on:
  push:
    branches: [main]
    paths:
      - 'Итоговая/kinoteka/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая публикация отменяет ещё не завершённую предыдущую
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Итоговая/kinoteka
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализатор и форматирование
        run: |
          flutter analyze
          dart format --set-exit-if-changed lib test

      - name: Тесты
        run: flutter test

      # Сайт проекта открывается по адресу /YP/, поэтому --base-href /YP/.
      # Данные — в проекте Supabase: адрес и публичный ключ в env/supabase.json
      - name: Сборка
        run: flutter build web --release --base-href /YP/ --dart-define-from-file=env/supabase.json

      # Pages отдаёт 404.html на любой неизвестный путь: копия index.html
      # загружает приложение, и оно само открывает нужный экран
      - name: Прямые ссылки
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Итоговая/kinoteka/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
